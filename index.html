<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MindToDo - 樹形図プロジェクト管理</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            oled: '#090d16',
            surface: '#111827',
            surfaceHover: '#1f2937',
          }
        }
      }
    };
  </script>

  <style>
    /* ベーススタイルと有機EL向けダークモード最適化 */
    html, body {
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }

    /* スムーズな横スクロール領域 */
    .tree-scroll-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .tree-scroll-container::-webkit-scrollbar {
      height: 6px;
    }
    .tree-scroll-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .tree-scroll-container::-webkit-scrollbar-thumb {
      background-color: #334155;
      border-radius: 9999px;
    }

    /* =========================================
       横向き樹形図（マインドマップ風）コネクタ線
       ========================================= */
    .tree-node-wrapper {
      display: flex;
      align-items: center;
    }

    /* 親ノードの右側へ伸びる枝線 */
    .tree-parent-connector {
      width: 20px;
      height: 2px;
      background-color: #334155;
      flex-shrink: 0;
    }

    /* 子ノード群のコンテナ */
    .tree-children {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 20px;
    }

    /* 各子ノード行 */
    .tree-child-row {
      position: relative;
      padding: 6px 0;
      display: flex;
      align-items: center;
    }

    /* 子ノード左側の水平コネクタ線 */
    .tree-child-row::before {
      content: '';
      position: absolute;
      left: -20px;
      top: 50%;
      width: 20px;
      height: 2px;
      background-color: #334155;
      transform: translateY(-50%);
    }

    /* 子ノード同士を繋ぐ垂直コネクタ線 */
    .tree-child-row::after {
      content: '';
      position: absolute;
      left: -20px;
      width: 2px;
      background-color: #334155;
      top: 0;
      bottom: 0;
    }

    /* 最初の子要素は中央から下へ */
    .tree-child-row:first-child::after {
      top: 50%;
    }

    /* 最後の子要素は上から中央へ */
    .tree-child-row:last-child::after {
      bottom: 50%;
    }

    /* 子要素が1つだけの場合は垂直線を表示しない */
    .tree-child-row:only-child::after {
      display: none;
    }

    /* ボトムシートのアニメーション */
    .sheet-backdrop {
      transition: opacity 0.25s ease;
    }
    .sheet-panel {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .sheet-hidden .sheet-backdrop {
      opacity: 0;
      pointer-events: none;
    }
    .sheet-hidden .sheet-panel {
      transform: translateY(100%);
    }

    /* 日付入力アイコンをダークモードで見やすく調整 */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.85);
      cursor: pointer;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500/30">

  <!-- ==================== ヘッダー ==================== -->
  <header class="sticky top-0 z-30 bg-oled/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <!-- アプリロゴ・タイトル -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h4m0 0v12m0-12h8a2 2 0 012 2v1m-10 9h8a2 2 0 002-2v-1m-10-4h6" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-100 leading-tight">MindToDo</h1>
          <p class="text-[11px] text-slate-400 leading-none mt-0.5">プロジェクト樹形図</p>
        </div>
      </div>

      <!-- 右側コントロール：完了を隠すトグル & 設定 -->
      <div class="flex items-center gap-2.5">
        <button
          id="toggle-hide-completed"
          type="button"
          role="switch"
          aria-checked="false"
          class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 active:scale-95 transition-all"
          title="完了済みToDoの表示切り替え"
        >
          <span class="text-xs font-medium text-slate-300">完了を隠す</span>
          <span id="toggle-track" class="relative inline-flex h-5 w-9 items-center rounded-full bg-slate-700 transition-colors">
            <span id="toggle-thumb" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform translate-x-1"></span>
          </span>
        </button>

        <button
          id="btn-open-settings"
          type="button"
          class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 active:scale-95 transition-all"
          aria-label="設定とバックアップ"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== メインコンテンツ ==================== -->
  <main class="flex-1 w-full max-w-5xl mx-auto px-3 sm:px-5 pt-4 pb-28">
    <!-- ヒントバー -->
    <div class="mb-4 px-3.5 py-2.5 rounded-2xl bg-slate-900/70 border border-slate-800/70 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span class="text-indigo-400">💡</span>
        <span>ゴールをタップして樹形図を展開・折りたたみ</span>
      </div>
      <span id="project-count-label" class="font-medium text-slate-300 shrink-0 ml-2">0 プロジェクト</span>
    </div>

    <!-- プロジェクト（ゴール）一覧コンテナ -->
    <div id="projects-container" class="space-y-4">
      <!-- JavaScriptで動的に描画 -->
    </div>

    <!-- プロジェクトが空のときの表示 -->
    <div id="empty-state" class="hidden text-center py-16 px-4">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <h2 class="text-base font-semibold text-slate-200 mb-1">プロジェクトがありません</h2>
      <p class="text-sm text-slate-400 mb-6">右下の「＋ ゴール追加」から新しい目標を作成しましょう。</p>
    </div>
  </main>

  <!-- ==================== 片手操作用 FAB（ゴール追加） ==================== -->
  <div class="fixed bottom-6 right-5 z-30">
    <button
      id="btn-add-goal"
      type="button"
      class="flex items-center gap-2 pl-4 pr-5 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-xl shadow-indigo-900/50 active:scale-95 transition-all"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
      </svg>
      <span>ゴール追加</span>
    </button>
  </div>

  <!-- ==================== ボトムシート：ノード追加・編集モーダル ==================== -->
  <div id="node-modal" class="fixed inset-0 z-50 sheet-hidden pointer-events-none" aria-hidden="true">
    <!-- 背景オーバーレイ -->
    <div id="node-modal-backdrop" class="sheet-backdrop fixed inset-0 bg-black/70 backdrop-blur-xs"></div>

    <!-- ボトムシート本体 -->
    <div class="fixed inset-x-0 bottom-0 flex justify-center pointer-events-none">
      <div class="sheet-panel pointer-events-auto w-full max-w-lg bg-slate-900 border-t border-x border-slate-800 rounded-t-3xl p-5 pb-8 shadow-2xl">
        <!-- ドラッグハンドル装飾 -->
        <div class="w-10 h-1.5 bg-slate-700 rounded-full mx-auto mb-4"></div>

        <div class="flex items-center justify-between mb-4">
          <h3 id="node-modal-title" class="text-lg font-bold text-slate-100">ゴールを追加</h3>
          <button id="btn-close-node-modal" type="button" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="node-form" class="space-y-4">
          <!-- 親ノード表示（サブタスク追加時など） -->
          <div id="parent-info-box" class="hidden px-3 py-2 rounded-xl bg-slate-950/70 border border-slate-800 text-xs text-slate-400">
            親項目: <span id="parent-info-name" class="text-indigo-300 font-medium"></span>
          </div>

          <!-- タイトル入力 -->
          <div>
            <label for="input-node-title" class="block text-xs font-medium text-slate-400 mb-1.5">タイトル</label>
            <input
              id="input-node-title"
              type="text"
              required
              placeholder="例：テキストの作成"
              class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 text-base"
            />
          </div>

          <!-- 期日入力（ToDo・ゴール両方で任意設定可能） -->
          <div id="due-date-section">
            <label for="input-node-date" class="block text-xs font-medium text-slate-400 mb-1.5">期日（任意）</label>
            <div class="flex items-center gap-2">
              <input
                id="input-node-date"
                type="date"
                class="flex-1 px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 text-sm"
              />
              <button
                type="button"
                id="btn-clear-date"
                class="px-3.5 py-3 rounded-xl bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700 active:scale-95"
              >
                クリア
              </button>
            </div>
            <!-- スマホ向けクイック期日ボタン -->
            <div class="flex flex-wrap gap-2 mt-2.5">
              <button type="button" data-quick-days="0" class="quick-date-btn px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs text-slate-300 hover:bg-slate-700 active:scale-95">今日</button>
              <button type="button" data-quick-days="1" class="quick-date-btn px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs text-slate-300 hover:bg-slate-700 active:scale-95">明日</button>
              <button type="button" data-quick-days="3" class="quick-date-btn px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs text-slate-300 hover:bg-slate-700 active:scale-95">3日後</button>
              <button type="button" data-quick-days="7" class="quick-date-btn px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/80 text-xs text-slate-300 hover:bg-slate-700 active:scale-95">1週間後</button>
            </div>
          </div>

          <!-- アクションボタン -->
          <div class="pt-2 flex items-center gap-3">
            <!-- 削除ボタン（編集時のみ表示・2段階確認） -->
            <button
              id="btn-delete-node"
              type="button"
              class="hidden px-4 py-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 font-semibold text-sm hover:bg-rose-500/25 active:scale-95 transition-all"
            >
              削除
            </button>
            <button
              type="submit"
              class="flex-1 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-900/40 active:scale-95 transition-all"
            >
              保存する
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ==================== ボトムシート：設定・バックアップモーダル ==================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 sheet-hidden pointer-events-none" aria-hidden="true">
    <div id="settings-modal-backdrop" class="sheet-backdrop fixed inset-0 bg-black/70 backdrop-blur-xs"></div>

    <div class="fixed inset-x-0 bottom-0 flex justify-center pointer-events-none">
      <div class="sheet-panel pointer-events-auto w-full max-w-lg max-h-[85vh] overflow-y-auto bg-slate-900 border-t border-x border-slate-800 rounded-t-3xl p-5 pb-8 shadow-2xl">
        <div class="w-10 h-1.5 bg-slate-700 rounded-full mx-auto mb-4"></div>

        <div class="flex items-center justify-between mb-5">
          <h3 class="text-lg font-bold text-slate-100">データ管理・バックアップ</h3>
          <button id="btn-close-settings" type="button" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="space-y-5">
          <!-- エクスポート -->
          <div class="p-4 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-3">
            <h4 class="text-sm font-semibold text-slate-200">データのエクスポート（バックアップ）</h4>
            <p class="text-xs text-slate-400 leading-relaxed">
              現在のすべてのプロジェクトとToDoをJSON形式で書き出します。機種変更やメモアプリへの保存に便利です。
            </p>
            <div class="grid grid-cols-2 gap-2.5">
              <button id="btn-export-copy" type="button" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                JSONをコピー
              </button>
              <button id="btn-export-download" type="button" class="py-2.5 px-3 rounded-xl bg-indigo-600/20 border border-indigo-500/40 hover:bg-indigo-600/30 text-indigo-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition-all">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                ファイル保存
              </button>
            </div>
          </div>

          <!-- インポート -->
          <div class="p-4 rounded-2xl bg-slate-950/70 border border-slate-800 space-y-3">
            <h4 class="text-sm font-semibold text-slate-200">データのインポート（復元）</h4>
            <p class="text-xs text-slate-400">
              バックアップしたJSONテキストを貼り付けるか、ファイルを選択してください。
            </p>
            <textarea
              id="input-import-json"
              rows="3"
              placeholder='ここにJSONデータを貼り付け...'
              class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 text-xs text-slate-200 font-mono placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            ></textarea>
            <div class="flex items-center gap-2.5">
              <label class="flex-1 py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold text-center cursor-pointer active:scale-95 transition-all">
                ファイルを選択
                <input id="input-import-file" type="file" accept=".json,application/json" class="hidden" />
              </label>
              <button id="btn-import-apply" type="button" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold active:scale-95 transition-all">
                JSONを復元
              </button>
            </div>
          </div>

          <!-- 初期データリセット -->
          <div class="pt-1 flex justify-end">
            <button id="btn-reset-sample" type="button" class="px-3.5 py-2 rounded-xl text-xs font-medium text-rose-400 hover:bg-rose-500/10 transition-colors">
              初期サンプルデータに戻す
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== トースト通知 ==================== -->
  <div id="toast-container" class="fixed bottom-24 inset-x-0 z-50 flex justify-center pointer-events-none px-4">
    <div id="toast-message" class="opacity-0 translate-y-3 transition-all duration-200 px-4 py-2.5 rounded-2xl bg-slate-800 border border-slate-700 text-slate-100 text-xs font-medium shadow-xl">
      通知メッセージ
    </div>
  </div>

  <!-- ==================== アプリケーションロジック ==================== -->
  <script>
    (() => {
      'use strict';

      // localStorage の保存キー
      const STORAGE_KEY = 'mind_todo_projects_v1';
      const SETTINGS_KEY = 'mind_todo_settings_v1';

      // ユニークID生成ヘルパー
      const generateId = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

      // 初期サンプルデータ（仕様通り：閉じた状態の「テキストの販売」ゴール）
      function createSampleData() {
        const year = new Date().getFullYear();
        return [
          {
            id: generateId(),
            title: 'テキストの販売',
            dueDate: '',
            completed: false,
            expanded: false, // 初期状態は閉じた状態
            children: [
              {
                id: generateId(),
                title: 'テキストの作成',
                dueDate: `${year}-11-25`,
                completed: false,
                expanded: true,
                children: []
              },
              {
                id: generateId(),
                title: 'テキストのチェック',
                dueDate: `${year}-11-30`,
                completed: false,
                expanded: true,
                children: []
              },
              {
                id: generateId(),
                title: 'テキストの講義動画作成',
                dueDate: `${year}-12-05`,
                completed: false,
                expanded: true,
                children: []
              },
              {
                id: generateId(),
                title: '告知用の動画作成',
                dueDate: `${year}-12-10`,
                completed: false,
                expanded: true,
                children: []
              }
            ]
          }
        ];
      }

      // アプリケーションの状態
      let projects = [];
      let settings = {
        hideCompleted: false
      };

      // モーダル編集用のコンテキスト
      let modalState = {
        mode: 'add-goal', // 'add-goal' | 'add-child' | 'edit'
        targetId: null,
        parentId: null,
        deleteArmed: false
      };

      let resetSampleArmed = false;
      let toastTimer = null;

      // DOM要素の参照
      const els = {
        projectsContainer: document.getElementById('projects-container'),
        emptyState: document.getElementById('empty-state'),
        projectCountLabel: document.getElementById('project-count-label'),
        toggleHideBtn: document.getElementById('toggle-hide-completed'),
        toggleTrack: document.getElementById('toggle-track'),

        toastMessage: document.getElementById('toast-message')

      /* =========================================
         データ永続化（localStorage）
         ========================================= */
      function loadData() {
        try {
          const savedProjects = localStorage.getItem(STORAGE_KEY);
          if (savedProjects) {
            const parsed = JSON.parse(savedProjects);
            if (Array.isArray(parsed)) {
              projects = parsed;
            } else {
              projects = createSampleData();
            }
          } else {
            projects = createSampleData();
            saveData();
          }

          const savedSettings = localStorage.getItem(SETTINGS_KEY);
          if (savedSettings) {
            const parsedSettings = JSON.parse(savedSettings);
            settings = { ...settings, ...parsedSettings };
          }
        } catch (err) {
          console.error('データの読み込みに失敗しました:', err);
          projects = createSampleData();
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (err) {
          console.error('データの保存に失敗しました:', err);
          showToast('保存に失敗しました（容量上限の可能性があります）');
        }
      }

      /* =========================================
         ツリー操作ヘルパー（再帰処理）
         ========================================= */
      // IDからノードを検索して返す
      function findNodeById(nodes, id) {
        for (const node of nodes) {
          if (node.id === id) return node;
          if (node.children && node.children.length > 0) {
            const found = findNodeById(node.children, id);
            if (found) return found;
          }
        }
        return null;
      }

      // IDのノードを削除する
      function deleteNodeById(nodes, id) {
        const index = nodes.findIndex(n => n.id === id);
        if (index !== -1) {
          nodes.splice(index, 1);
          return true;
        }
        for (const node of nodes) {
          if (node.children && node.children.length > 0) {
            if (deleteNodeById(node.children, id)) return true;
          }
        }
        return false;
      }

      // 配下の全ToDoの進捗（完了数 / 総数）を集計する
      function calculateProgress(node) {
        let total = 0;
        let completed = 0;

        function traverse(children) {
          for (const child of children) {
            total += 1;
            if (child.completed) completed += 1;
            if (child.children && child.children.length > 0) {
              traverse(child.children);
            }
          }
        }

        if (node.children && node.children.length > 0) {
          traverse(node.children);
        }
        return { total, completed };
      }

      /* =========================================
         日付フォーマット＆期限ステータス判定
         ========================================= */
      function getDateBadgeInfo(dateStr, isCompleted) {
        if (!dateStr) return null;

        // YYYY-MM-DD をローカル日付として正確にパース
        const parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);

        const targetDate = new Date(year, month - 1, day);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));

        const label = `${String(month).padStart(2, '0')}/${String(day).padStart(2, '0')}`;

        // 完了済みの場合は落ち着いた色にする
        if (isCompleted) {
          return {
            label,
            classes: 'bg-slate-800/80 text-slate-500 border-slate-700/60'
          };
        }

        // 期限切れ：赤強調
        if (diffDays < 0) {
          return {
            label,
            classes: 'bg-rose-500/20 text-rose-300 border-rose-500/50 font-semibold'
          };
        }

        // 今日・明日：オレンジ強調
        if (diffDays === 0 || diffDays === 1) {
          return {
            label,
            classes: 'bg-amber-500/20 text-amber-300 border-amber-500/50 font-semibold'
          };
        }

        // 通常
        return {
          label,
          classes: 'bg-slate-800 text-slate-300 border-slate-700'
        };
      }

      function formatDateToInput(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      /* =========================================
         トースト通知
         ========================================= */
      function showToast(text) {
        els.toastMessage.textContent = text;
        els.toastMessage.classList.remove('opacity-0', 'translate-y-3');
        els.toastMessage.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          els.toastMessage.classList.remove('opacity-100', 'translate-y-0');
          els.toastMessage.classList.add('opacity-0', 'translate-y-3');
        }, 2400);
      }

      /* =========================================
         UI描画（レンダリング）
         ========================================= */
      function updateToggleUI() {
        const isOn = settings.hideCompleted;
        els.toggleHideBtn.setAttribute('aria-checked', String(isOn));
        if (isOn) {
          els.toggleTrack.classList.remove('bg-slate-700');
          els.toggleTrack.classList.add('bg-indigo-600');
          els.toggleThumb.classList.remove('translate-x-1');
          els.toggleThumb.classList.add('translate-x-4');
        } else {
          els.toggleTrack.classList.remove('bg-indigo-600');
          els.toggleTrack.classList.add('bg-slate-700');
          els.toggleThumb.classList.remove('translate-x-4');
          els.toggleThumb.classList.add('translate-x-1');
        }
      }

      function render() {
        updateToggleUI();
        els.projectCountLabel.textContent = `${projects.length} プロジェクト`;
        els.projectsContainer.innerHTML = '';

        if (projects.length === 0) {
          els.emptyState.classList.remove('hidden');
          return;
        }
        els.emptyState.classList.add('hidden');

        projects.forEach(project => {
          const card = createProjectCard(project);
          els.projectsContainer.appendChild(card);
        });
      }

      // プロジェクト単位のカード（横スクロール可能なツリー領域）を生成
      function createProjectCard(project) {
        const wrapper = document.createElement('section');
        wrapper.className = 'rounded-3xl bg-slate-900/60 border border-slate-800/80 shadow-lg overflow-hidden';

        const scrollArea = document.createElement('div');
        scrollArea.className = 'tree-scroll-container p-4 sm:p-5';

        const treeRoot = createTreeNodeElement(project, true);
        scrollArea.appendChild(treeRoot);
        wrapper.appendChild(scrollArea);

        return wrapper;
      }

      // 再帰的に横向き樹形図のノードと子要素を構築
      function createTreeNodeElement(node, isGoal) {
        const nodeWrapper = document.createElement('div');
        nodeWrapper.className = 'tree-node-wrapper';

        // 表示対象の子要素をフィルタリング（「完了を隠す」対応）
        const allChildren = node.children || [];
        const visibleChildren = settings.hideCompleted
          ? allChildren.filter(child => !child.completed)
          : allChildren;

        // 1. ノード本体カードを作成
        const card = isGoal
          ? createGoalCardElement(node, allChildren.length)
          : createTodoCardElement(node, allChildren.length);

        nodeWrapper.appendChild(card);

        // 2. 展開中かつ表示すべき子がある場合は、右側に枝線＋子リストを配置
        if (node.expanded && visibleChildren.length > 0) {
          const connector = document.createElement('div');
          connector.className = 'tree-parent-connector';
          nodeWrapper.appendChild(connector);

          const childrenContainer = document.createElement('div');
          childrenContainer.className = 'tree-children';

          visibleChildren.forEach(child => {
            const childRow = document.createElement('div');
            childRow.className = 'tree-child-row';
            childRow.appendChild(createTreeNodeElement(child, false));
            childrenContainer.appendChild(childRow);
          });

          nodeWrapper.appendChild(childrenContainer);
        } else if (node.expanded && isGoal && allChildren.length > 0 && visibleChildren.length === 0) {
          // すべて完了済み＆「完了を隠す」ONのときのフィードバックノード
          const connector = document.createElement('div');
          connector.className = 'tree-parent-connector';
          nodeWrapper.appendChild(connector);

          const doneBadge = document.createElement('div');
          doneBadge.className = 'px-3.5 py-2 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs font-medium whitespace-nowrap';
          doneBadge.textContent = '🎉 すべてのToDoが完了しました';
          nodeWrapper.appendChild(doneBadge);
        }

        return nodeWrapper;
      }

      // ToDo（子・孫ノード）のUI生成
      function createTodoCardElement(todo, childrenCount) {
        const card = document.createElement('div');
        card.className = [
          'flex items-center gap-2 min-w-[220px] max-w-[300px] shrink-0 rounded-2xl px-3 py-2.5 border transition-all select-none',
          todo.completed
            ? 'bg-slate-900/40 border-slate-800/60 opacity-55'
            : 'bg-slate-900 border-slate-700/80 hover:border-slate-600 shadow-sm'
        ].join(' ');

        // 1. チェックボックス（指で押しやすいサイズ）
        const checkBtn = document.createElement('button');
        checkBtn.type = 'button';
        checkBtn.setAttribute('aria-label', todo.completed ? '未完了に戻す' : '完了にする');
        checkBtn.className = [
          'w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition-all active:scale-90',
          todo.completed
            ? 'bg-emerald-500 border-emerald-500 text-slate-950'
            : 'border-slate-500 hover:border-indigo-400 bg-slate-950/60'

        }

          e.stopPropagation();
          todo.completed = !todo.completed;
          saveData();
          render();
        });

          }

        // 期日バッジ（ToDo名の前にコンパクト表示）
        const dateInfo = getDateBadgeInfo(todo.dueDate, todo.completed);

          const dateBadge = document.createElement('span');
          dateBadge.className = `px-1.5 py-0.5 rounded-md border text-[11px] leading-tight shrink-0 font-mono ${dateInfo.classes}`;

        }`;

        addSubBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>`;
        addSubBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openNodeModal({ mode: 'add-child', parentId: todo.id });
        });

        const editBtn = document.createElement('button');
        editBtn.type = 'button';

        editBtn.className = 'w-7 h-7 rounded-lg bg-slate-800/80 text-slate-400 hover:text-slate-200 flex items-center justify-center active:scale-90 transition-all';
        editBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>`;
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openNodeModal({ mode: 'edit', targetId: todo.id });
        });

        actions.appendChild(addSubBtn);
        actions.appendChild(editBtn);

        card.appendChild(checkBtn);
        card.appendChild(contentBtn);
        card.appendChild(actions);

        return card;
      }

      /* =========================================
         ボトムシート：ノード追加・編集モーダル制御
         ========================================= */
      function openNodeModal({ mode, targetId = null, parentId = null }) {
        modalState = { mode, targetId, parentId, deleteArmed: false };
        resetDeleteButton();

        if (mode === 'add-goal') {
          els.nodeModalTitle.textContent = '新しいゴールを追加';
          els.parentInfoBox.classList.add('hidden');
          els.btnDeleteNode.classList.add('hidden');
          els.inputNodeTitle.value = '';
          els.inputNodeTitle.placeholder = '例：テキストの販売';
          els.inputNodeDate.value = '';
        } else if (mode === 'add-child') {
          const parentNode = findNodeById(projects, parentId);
          els.nodeModalTitle.textContent = 'ToDoを追加';
          els.parentInfoBox.classList.remove('hidden');
          els.parentInfoName.textContent = parentNode ? parentNode.title : '';
          els.btnDeleteNode.classList.add('hidden');
          els.inputNodeTitle.value = '';
          els.inputNodeTitle.placeholder = '例：テキストの作成';
          els.inputNodeDate.value = '';
        } else if (mode === 'edit') {
          const targetNode = findNodeById(projects, targetId);
          if (!targetNode) return;
          const isGoal = projects.some(p => p.id === targetId);
          els.nodeModalTitle.textContent = isGoal ? 'ゴールを編集' : 'ToDoを編集';
          els.parentInfoBox.classList.add('hidden');
          els.btnDeleteNode.classList.remove('hidden');
          els.inputNodeTitle.value = targetNode.title;
          els.inputNodeDate.value = targetNode.dueDate || '';
        }

        els.nodeModal.classList.remove('sheet-hidden', 'pointer-events-none');
        els.nodeModal.setAttribute('aria-hidden', 'false');
        setTimeout(() => els.inputNodeTitle.focus(), 180);
      }

      function closeNodeModal() {
        els.nodeModal.classList.add('sheet-hidden', 'pointer-events-none');
        els.nodeModal.setAttribute('aria-hidden', 'true');
        els.inputNodeTitle.blur();
      }

      function resetDeleteButton() {
        modalState.deleteArmed = false;
        els.btnDeleteNode.textContent = '削除';
        els.btnDeleteNode.className = 'px-4 py-3.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 font-semibold text-sm hover:bg-rose-500/25 active:scale-95 transition-all';
      }

      /* =========================================
         ボトムシート：設定・バックアップモーダル制御
         ========================================= */
      function openSettingsModal() {
        resetSampleArmed = false;
        els.btnResetSample.textContent = '初期サンプルデータに戻す';
        els.inputImportJson.value = '';
        els.settingsModal.classList.remove('sheet-hidden', 'pointer-events-none');
        els.settingsModal.setAttribute('aria-hidden', 'false');
      }

      function closeSettingsModal() {
        els.settingsModal.classList.add('sheet-hidden', 'pointer-events-none');
        els.settingsModal.setAttribute('aria-hidden', 'true');
      }

      // クリップボードへJSONコピー（iFrame互換のexecCommandを使用）
      function copyJsonToClipboard() {
        const jsonStr = JSON.stringify(projects, null, 2);
        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = jsonStr;
        tempTextarea.style.position = 'fixed';
        tempTextarea.style.opacity = '0';
        document.body.appendChild(tempTextarea);
        tempTextarea.select();

        try {
          const ok = document.execCommand('copy');
          if (ok) {
            showToast('JSONデータをクリップボードにコピーしました');
          } else {
            showToast('コピーに失敗しました');
          }
        } catch (err) {
          console.error('Copy error:', err);
          showToast('コピーに失敗しました');
        } finally {
          document.body.removeChild(tempTextarea);
        }
      }

      // JSONファイルとしてダウンロード
      function downloadJsonFile() {
        try {
          const jsonStr = JSON.stringify(projects, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const todayStr = formatDateToInput(new Date());
          a.href = url;
          a.download = `mind-todo-backup-${todayStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('バックアップファイルを保存しました');
        } catch (err) {
          console.error('Download error:', err);
          showToast('ファイル保存に失敗しました');
        }
      }

      // JSONテキストを検証してインポート
      function importJsonString(rawText) {
        try {
          const trimmed = rawText.trim();
          if (!trimmed) {
            showToast('JSONデータが入力されていません');
            return;
          }
          const parsed = JSON.parse(trimmed);
          if (!Array.isArray(parsed)) {
            showToast('無効なデータ形式です（配列である必要があります）');
            return;
          }

          // ノード構造を正規化して安全に取り込む
          const normalizeNode = (item) => ({
            id: typeof item.id === 'string' && item.id ? item.id : generateId(),
            title: typeof item.title === 'string' ? item.title : '無題',
            dueDate: typeof item.dueDate === 'string' ? item.dueDate : '',
            completed: Boolean(item.completed),
            expanded: Boolean(item.expanded),
            children: Array.isArray(item.children) ? item.children.map(normalizeNode) : []
          });

          projects = parsed.map(normalizeNode);
          saveData();
          render();
          closeSettingsModal();
          showToast('データを復元しました');
        } catch (err) {
          console.error('Import error:', err);
          showToast('JSONの形式が正しくありません');
        }
      }

      /* =========================================
         イベントリスナー登録
         ========================================= */
      function setupEventListeners() {
        // 完了を隠すトグル
        els.toggleHideBtn.addEventListener('click', () => {
          settings.hideCompleted = !settings.hideCompleted;
          saveData();
          render();
        });

        // ゴール追加ボタン（FAB）
        els.btnAddGoal.addEventListener('click', () => {
          openNodeModal({ mode: 'add-goal' });
        });

        // ノードモーダルを閉じる
        els.btnCloseNodeModal.addEventListener('click', closeNodeModal);
        els.nodeModalBackdrop.addEventListener('click', closeNodeModal);

        // クイック日付ボタン
        document.querySelectorAll('.quick-date-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const addDays = parseInt(btn.getAttribute('data-quick-days'), 10);
            const target = new Date();
            target.setDate(target.getDate() + addDays);
            els.inputNodeDate.value = formatDateToInput(target);
          });
        });

        // 日付クリアボタン
        els.btnClearDate.addEventListener('click', () => {
          els.inputNodeDate.value = '';
        });

        // ノード保存フォーム送信
        els.nodeForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const title = els.inputNodeTitle.value.trim();
          const dueDate = els.inputNodeDate.value;
          if (!title) return;

          if (modalState.mode === 'add-goal') {
            projects.push({
              id: generateId(),
              title,
              dueDate,
              completed: false,
              expanded: false,
              children: []
            });
            showToast('ゴールを追加しました');
          } else if (modalState.mode === 'add-child') {
            const parentNode = findNodeById(projects, modalState.parentId);
            if (parentNode) {
              if (!Array.isArray(parentNode.children)) parentNode.children = [];
              parentNode.children.push({
                id: generateId(),
                title,
                dueDate,
                completed: false,
                expanded: true,
                children: []
              });
              // 追加したら自動的に親を展開して見やすくする
              parentNode.expanded = true;
              showToast('ToDoを追加しました');
            }
          } else if (modalState.mode === 'edit') {
            const targetNode = findNodeById(projects, modalState.targetId);
            if (targetNode) {
              targetNode.title = title;
              targetNode.dueDate = dueDate;
              showToast('変更を保存しました');
            }
          }

          saveData();
          render();
          closeNodeModal();
        });

        // ノード削除（誤操作防止のため2段階タップ確認）
        els.btnDeleteNode.addEventListener('click', () => {
          if (!modalState.deleteArmed) {
            modalState.deleteArmed = true;
            els.btnDeleteNode.textContent = '本当に削除？';
            els.btnDeleteNode.className = 'px-4 py-3.5 rounded-xl bg-rose-600 text-white font-bold text-sm active:scale-95 transition-all';
            return;
          }

          if (modalState.targetId) {
            deleteNodeById(projects, modalState.targetId);
            saveData();
            render();
            closeNodeModal();
            showToast('削除しました');
          }
        });

        // 設定モーダル開閉
        els.btnOpenSettings.addEventListener('click', openSettingsModal);
        els.btnCloseSettings.addEventListener('click', closeSettingsModal);
        els.settingsModalBackdrop.addEventListener('click', closeSettingsModal);

        // エクスポート
        els.btnExportCopy.addEventListener('click', copyJsonToClipboard);
        els.btnExportDownload.addEventListener('click', downloadJsonFile);

        // インポート（テキスト）
        els.btnImportApply.addEventListener('click', () => {
          importJsonString(els.inputImportJson.value);
        });

        // インポート（ファイル選択）
        els.inputImportFile.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            if (typeof ev.target.result === 'string') {
              els.inputImportJson.value = ev.target.result;
              importJsonString(ev.target.result);
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        });

        // サンプルデータにリセット（2段階タップ確認）
        els.btnResetSample.addEventListener('click', () => {
          if (!resetSampleArmed) {
            resetSampleArmed = true;
            els.btnResetSample.textContent = 'タップで初期化を実行（現在データは消えます）';
            return;
          }
          projects = createSampleData();
          saveData();
          render();
          closeSettingsModal();
          showToast('初期サンプルデータに戻しました');
        });
      }

      // 初期化実行
      function init() {
        loadData();
        setupEventListeners();
        render();
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
